# Build and test NESH on every push and pull request; on a version tag (v*),
# also publish a GitHub Release with nesh.efi built here from the tagged source.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf ipxe-qemu dosfstools python3 \
            sbsigntool python3-virt-firmware

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: make -j"$(nproc)"

      - name: Host tests and documentation checks
        run: make test

      - name: UEFI tests (QEMU/OVMF)
        run: make qemu-test

      - name: Network tests (QEMU/OVMF)
        run: make qemu-nettest

      - name: Secure Boot tests (QEMU/OVMF, own test keys)
        run: make qemu-sbtest

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: build/qemu-*.log.txt
          if-no-files-found: ignore

      - name: Keep nesh.efi
        uses: actions/upload-artifact@v4
        with:
          name: nesh.efi
          path: build/nesh.efi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nesh.efi
          path: dist

      - name: Checksum
        run: cd dist && sha256sum nesh.efi > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the annotation of the tag becomes the description of the release
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "NESH $GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<EOF

          Built and tested by GitHub Actions from this tag.

          **Download** \`nesh.efi\` (UEFI x86-64). Copy it to a FAT USB stick as
          \`\EFI\BOOT\BOOTX64.EFI\` to boot it from the firmware menu, or start it
          from another shell. Check the download with \`sha256sum -c SHA256SUMS\`.

          **Secure Boot:** the file is not signed. Sign it with your own key or
          disable Secure Boot (see the user manual).

          Documentation: https://nic-fio.github.io/NG-EFI_SHELL/
          EOF
          gh release create "$GITHUB_REF_NAME" dist/nesh.efi dist/SHA256SUMS \
            --title "NESH $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
