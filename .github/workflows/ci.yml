# Build and test NESH and partmgr on every push and pull request; on a version
# tag (v*), also publish a GitHub Release with nesh.efi and partmgr.efi built
# here from the tagged source (two separate files: two separate products).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf ipxe-qemu dosfstools fdisk parted python3 \
            sbsigntool python3-virt-firmware

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: make -j"$(nproc)"

      - name: Host tests and documentation checks
        run: make test

      - name: UEFI tests (QEMU/OVMF)
        run: make qemu-test

      - name: Network tests (QEMU/OVMF)
        run: make qemu-nettest

      - name: Secure Boot tests (QEMU/OVMF, own test keys)
        run: make qemu-sbtest

      - name: partmgr.efi tests (QEMU/OVMF)
        run: make qemu-partmgr

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: build/qemu-*.log.txt
          if-no-files-found: ignore

      - name: Keep nesh.efi
        uses: actions/upload-artifact@v4
        with:
          name: nesh.efi
          path: build/nesh.efi

      - name: Keep partmgr.efi
        uses: actions/upload-artifact@v4
        with:
          name: partmgr.efi
          path: build/partmgr.efi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the annotated tag object, for the release notes
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: nesh.efi
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: partmgr.efi
          path: dist

      - name: Checksum
        run: cd dist && sha256sum nesh.efi partmgr.efi > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the annotation of the tag becomes the description of the release
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "NESH $GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<EOF

          Built and tested by GitHub Actions from this tag.

          **Download** \`nesh.efi\` (UEFI x86-64). Copy it to a FAT USB stick as
          \`\EFI\BOOT\BOOTX64.EFI\` to boot it from the firmware menu, or start it
          from another shell. Check the downloads with \`sha256sum -c --ignore-missing SHA256SUMS\`.

          **Also attached: \`partmgr.efi\`**, the partition manager of the project,
          a separate program: GPT and MBR partition tables, changes shown before
          they are written, backup and restore, wipe. Start it from NESH or from
          the firmware boot menu. Manual:
          https://nic-fio.github.io/NG-EFI_SHELL/partmgr-user-manual.html

          **Secure Boot:** the files are not signed. Sign them with your own key or
          disable Secure Boot (see the user manuals).

          **Licence:** Apache 2.0 with the Commons Clause, attached here as
          \`LICENSE\` and \`NOTICE.md\`: free to use, to copy and to modify,
          not to sell. Source-available, not OSI open source.

          Documentation: https://nic-fio.github.io/NG-EFI_SHELL/
          EOF
          gh release create "$GITHUB_REF_NAME" dist/nesh.efi dist/partmgr.efi dist/SHA256SUMS \
            LICENSE NOTICE.md \
            --title "NESH $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
